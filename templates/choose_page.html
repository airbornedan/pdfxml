{% extends "base.html" %}
{% block content %}
<div class="page-container wide">
	{% include "_breadcrumbs.html" %}
	<h1>Which page?</h1>
	<p class="subtitle">{{ page_count }} page{{ "s" if page_count != 1 }} total</p>
	{% if error %}<p class="error-text">{{ error }}</p>{% endif %}
	<form method="post">
		<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
		<div class="field">
			<label for="page_number">Page number</label>
			<input type="number" id="page_number" name="page_number" min="1" max="{{ page_count }}" autofocus>
		</div>
		<button type="submit">Show page</button>

		<p class="subtitle">Or click a page below</p>
		<div class="page-thumb-grid">
			{% for n in range(1, page_count + 1) %}
			<button type="submit" name="thumb_page_number" value="{{ n }}" class="page-thumb-btn" formnovalidate>
				<img class="page-thumb-img" width="306" height="396"
				     data-src="{{ url_for('extract.page_thumbnail', page=n, v=thumb_version) }}" alt="Page {{ n }}">
				<span class="page-thumb-label">Page {{ n }}</span>
			</button>
			{% endfor %}
		</div>
	</form>
</div>

<script nonce="{{ g.csp_nonce }}">
(function () {
	const imgs = document.querySelectorAll("img.page-thumb-img[data-src]");
	const load = (img) => { img.src = img.dataset.src; img.removeAttribute("data-src"); };
	if (!("IntersectionObserver" in window)) {
		imgs.forEach(load);
		return;
	}
	// start fetching ~a screen ahead of the viewport so a normal scroll
	// never outruns the loads; a fast fling still shows sized placeholders
	const io = new IntersectionObserver((entries, obs) => {
		for (const e of entries) {
			if (!e.isIntersecting) continue;
			load(e.target);
			obs.unobserve(e.target);
		}
	}, { rootMargin: "800px 0px" });
	imgs.forEach((img) => io.observe(img));
})();
</script>
{% endblock %}
