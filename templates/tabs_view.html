{% extends "base.html" %}
{% block content %}
<div class="page-container">
	{% include "_breadcrumbs.html" %}
	<h1 class="tools-heading">{{ title }}</h1>

	<div class="tab-list" role="tablist" aria-label="{{ title }} tabs">
		{% for tab in tabs %}
		<button class="tab-button{% if loop.first %} active{% endif %}" type="button" role="tab"
			aria-selected="{{ 'true' if loop.first else 'false' }}" data-tab-target="tab-{{ loop.index }}">{{ tab.label }}</button>
		{% endfor %}
	</div>
	{% for tab in tabs %}
	<article class="tab-panel{% if loop.first %} active{% endif %}" id="tab-{{ loop.index }}" role="tabpanel" aria-label="{{ tab.label }}">
		{{ tab.content|safe }}
	</article>
	{% endfor %}
</div>
<script nonce="{{ g.csp_nonce }}">
document.querySelectorAll(".tab-button").forEach((button) => {
	button.addEventListener("click", () => {
		document.querySelectorAll(".tab-button").forEach((b) => {
			b.classList.toggle("active", b === button);
			b.setAttribute("aria-selected", b === button ? "true" : "false");
		});
		document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === button.dataset.tabTarget));
	});
});

// flex-wrap has no "min items on the last row" -- it wraps purely by
// width, so a count that doesn't divide evenly can strand one lone
// button on its own row. If that happens, force a line break before
// the second-to-last button instead, so the last row always gets (at
// least) two.
function balanceTabRows(list) {
	list.querySelectorAll(".tab-break").forEach((el) => el.remove());
	const buttons = Array.from(list.querySelectorAll(".tab-button"));
	if (buttons.length < 3) return;
	const tops = buttons.map((b) => b.offsetTop);
	const lastRowStart = tops.indexOf(Math.max(...tops));
	if (lastRowStart === 0 || buttons.length - lastRowStart !== 1) return;
	buttons[buttons.length - 2].before(Object.assign(document.createElement("span"), { className: "tab-break" }));
}

const tabLists = document.querySelectorAll(".tab-list");
let resizeTimer;
window.addEventListener("resize", () => {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(() => tabLists.forEach(balanceTabRows), 100);
});
tabLists.forEach(balanceTabRows);
</script>
{% endblock %}
