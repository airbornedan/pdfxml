# nginx reverse proxy + TLS termination for PDFXML -- gunicorn
# (deploy/pdfxml.service) binds 127.0.0.1 only and is never reachable
# directly; this is the only thing that faces the LAN.
#
# install:
#   sudo cp deploy/pdfxml.nginx.conf /etc/nginx/sites-available/pdfxml
#   sudo ln -s /etc/nginx/sites-available/pdfxml /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# adjust server_name and the cert/key paths below. This is a private
# LAN address, not a public hostname, so Let's Encrypt's validation
# won't work here -- use a self-signed cert or an internal CA instead.

server {
	listen 80;
	listen [::]:80;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name _;

	ssl_certificate     /etc/ssl/pdfxml/fullchain.pem;
	ssl_certificate_key /etc/ssl/pdfxml/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	client_max_body_size 50M;  # matches MAX_UPLOAD_BYTES in app/extensions.py

	location / {
		proxy_pass http://127.0.0.1:8089;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
