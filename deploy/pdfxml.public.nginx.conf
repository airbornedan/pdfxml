# nginx reverse proxy + TLS for the PUBLIC deployment of PDFXML.
# gunicorn (deploy/pdfxml.public.service) binds 127.0.0.1:8089 and is
# never reachable directly; this is the only thing on the internet.
#
# install:
#   sudo cp deploy/pdfxml.public.nginx.conf /etc/nginx/sites-available/pdfxml
#   sudo ln -s /etc/nginx/sites-available/pdfxml /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d pdfxml.example.com    # issues + wires up the cert
#   sudo nginx -t && sudo systemctl reload nginx
#
# replace pdfxml.example.com throughout with the real hostname.
#
# The app sets its own security headers -- do NOT add_header here
# (would double up or override).
#
# content/legal/*.md say the service isn't offered in the EU/EEA/UK.
# Enforce with an nginx geo / GeoIP2 block or a CDN rule -- not wired up here.

# coarse per-IP backstop in front of the app's [ratelimit]. 10m ~= 160k IPs.
limit_req_zone  $binary_remote_addr  zone=pdfxml_req:10m   rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=pdfxml_conn:10m;

server {
	listen 80;
	listen [::]:80;
	server_name pdfxml.example.com;

	# let certbot renew without a redirect bounce
	location /.well-known/acme-challenge/ { root /var/www/certbot; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name pdfxml.example.com;

	ssl_certificate     /etc/letsencrypt/live/pdfxml.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pdfxml.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;
	ssl_stapling on;
	ssl_stapling_verify on;

	server_tokens off;
	client_max_body_size 50M;   # matches MAX_UPLOAD_BYTES
	client_body_timeout 30s;
	send_timeout 30s;

	limit_conn pdfxml_conn 10;

	location / {
		limit_req zone=pdfxml_req burst=20 nodelay;
		proxy_pass http://127.0.0.1:8089;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 100s;   # > gunicorn --timeout 90
	}

	# uploads: stricter still
	location = /upload {
		limit_req zone=pdfxml_req burst=5 nodelay;
		proxy_pass http://127.0.0.1:8089;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
